name: Build and deploy

# Every push to main: build (always) → deploy to Cloudflare (only once the repo secrets exist).
# Secrets: CLOUDFLARE_API_TOKEN (Edit Workers template) + CLOUDFLARE_ACCOUNT_ID.
# Alternative with NO secrets: connect this repo to the Worker in the Cloudflare dashboard
# (Workers & Pages → rk-bridal → Settings → Build), exactly like cognit-site / zeabyte-website.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Are deploy secrets configured?
        id: cfg
        run: echo "deploy=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker + static assets
        if: steps.cfg.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke test
        if: steps.cfg.outputs.deploy == 'true'
        run: |
          sleep 10
          for p in / /bridal-makeup/ /groom-makeup/ /areas/chandigarh/ /blog/ /sitemap-index.xml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://rk-bridal.zeabyte.workers.dev$p")
            echo "$code $p"; [ "$code" = "200" ] || exit 1
          done

      - name: Not deployed (no secrets yet)
        if: steps.cfg.outputs.deploy != 'true'
        run: echo "Build OK. Deploy skipped - add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo secrets, or connect the repo in the Cloudflare dashboard."
